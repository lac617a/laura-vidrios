name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, migraciones, build y E2E
    runs-on: ubuntu-latest

    # Postgres desechable: valida que las migraciones y el seed corren limpios.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lauravidrio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lauravidrio
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Solo para el build de CI; producción usa su propio secreto en Vercel.
      BETTER_AUTH_SECRET: ci-build-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar esquema de Prisma
        run: pnpm prisma validate

      - name: Aplicar migraciones
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E (flujos de venta, login, accesibilidad WCAG) contra el build de producción
      # (pnpm start) y la BD del seed: Chrome de escritorio, Android e iPhone (WebKit).
      - name: Instalar navegadores para Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E
        run: pnpm e2e
        env:
          E2E_WEBKIT: iphone

      - name: Reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
